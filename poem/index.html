<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ديوان — Diwan</title>
  <!-- Smart App Banner: offers the app on iOS Safari -->
  <meta name="apple-itunes-app" content="app-id=6714480469">
  <style>
    :root { --green: #046D33; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: #F3EEE3; color: #1C1B18; text-align: center; padding: 24px;
    }
    h1 { color: var(--green); margin: 0; }
    p { color: #6B6A63; max-width: 32rem; line-height: 1.7; }
    a.btn {
      background: var(--green); color: #fff; text-decoration: none;
      padding: 14px 28px; border-radius: 14px; font-weight: 700; font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <h1>ديوان — Diwan</h1>
  <p>إذا كان التطبيق مثبتًا على جهازك فسيتم فتح القصيدة تلقائيًا. وإلا يمكنك تنزيل التطبيق من App Store.</p>
  <a class="btn" id="store" href="https://apps.apple.com/us/app/diwan-%D8%AF%D9%8A%D9%88%D8%A7%D9%86/id6714480469">تنزيل التطبيق</a>

  <script>
    // If the app is installed, iOS opens it directly via the Universal Link and
    // this page is never shown. This script is the fallback for when it isn't:
    // try the custom scheme once, then send the user to the App Store.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var path = params.get('path');
      var appStore = document.getElementById('store').href;

      if (path) {
        // Attempt to open the app via its custom scheme.
        var scheme = 'diwan://poem?path=' + encodeURIComponent(path);
        var start = Date.now();
        var timer = setTimeout(function () {
          // If we're still here after ~1.2s, the app isn't installed.
          if (Date.now() - start < 2000) { window.location.href = appStore; }
        }, 1200);
        window.location.href = scheme;
      }
    })();
  </script>
</body>
</html>
